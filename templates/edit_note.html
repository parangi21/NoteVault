<!DOCTYPE html>
<html>
<head>
    <title>Edit Note</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Edit Note</h1>

        <form method="POST">

            <input
                type="text"
                name="title"
                value="{{ note.title }}"
                required
            >

            <textarea
                name="content"
                required
            >{{ note.content }}</textarea>

            <button type="submit">
                Update Note
            </button>

        </form>

    </div>

</div>

</body>
</html>
